# Reliable Order Intake - production bindings are non-inheritable
[[env.production.d1_databases]]
binding = "ORDER_INTAKE_DB"
database_name = "foryou-order-intake"
database_id = "REPLACE_WITH_FORYOU_D1_DATABASE_ID"

[[env.production.queues.producers]]
binding = "ORDER_INTAKE_QUEUE"
